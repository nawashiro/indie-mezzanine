schema: spec-driven

context: |
  Language: Japanese
  All artifacts must be written in Japanese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: mezzanine (working name), based on the 「中二階」 concept.
  Source: https://nawashiro.dev/posts/20261005-mezzanine
  Goal: small shared spaces identified by random identifiers, with private local nicknames.
  Accepted initial change: build-public-collection-relay.
  Initial implementation: a public Webmention relay using Go and SQLite, with collection-specific Atom feeds.
  Private local nicknames, GUI, and multi-relay collection/merging remain outside the initial scope.
  Separate accepted requirements from hypotheses and open questions.
